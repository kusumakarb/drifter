version: '3.8'

services:
  driftwatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: driftwatch:latest
    container_name: driftwatch

    # Volume mounts for user data and outputs
    volumes:
      # GX outputs (validations and data docs) - write to host
      - ./docker-outputs/validations:/app/gx/uncommitted/validations
      - ./docker-outputs/data_docs:/app/gx/uncommitted/data_docs

      # Optional: User's config file (read-only)
      # Uncomment and modify path as needed
      # - /path/to/your/config.yaml:/app/user_config.yaml:ro

      # Optional: User's data files (read-only)
      # Uncomment and modify paths as needed
      # - /path/to/your/reference.csv:/app/user_data/reference.csv:ro
      # - /path/to/your/new_data.csv:/app/user_data/new_data.csv:ro

      # Optional: Custom outputs directory
      - ./docker-outputs/reports:/app/outputs

    # Environment variables (optional)
    environment:
      # Python optimizations
      - PYTHONUNBUFFERED=1

    # Resource limits (optional but recommended)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

# ============================================================================
# USAGE EXAMPLES (run from directory containing docker-compose.yml)
# ============================================================================

# BUILD IMAGE
# docker-compose build

# PROFILE with built-in sample data
# docker-compose run --rm driftwatch profile --reference data/reference/reference_data.csv --config driftwatch_config.yaml

# EVALUATE with built-in sample data
# docker-compose run --rm driftwatch evaluate --new data/drifted/new_data_with_drift.csv

# LIST available expectations
# docker-compose run --rm driftwatch list-expectations

# PROFILE with your own data (mount files on-the-fly)
# docker-compose run --rm \
#   -v /path/to/your/data.csv:/app/user_data/data.csv:ro \
#   -v /path/to/your/config.yaml:/app/user_config.yaml:ro \
#   driftwatch profile --reference /app/user_data/data.csv --config /app/user_config.yaml

# EVALUATE with your own data
# docker-compose run --rm \
#   -v /path/to/your/new_data.csv:/app/user_data/new_data.csv:ro \
#   driftwatch evaluate --new /app/user_data/new_data.csv

# VIEW HTML reports (after evaluation)
# Open: docker-outputs/data_docs/local_site/index.html in your browser
# Linux: xdg-open docker-outputs/data_docs/local_site/index.html
# macOS: open docker-outputs/data_docs/local_site/index.html
# Windows: start docker-outputs\data_docs\local_site\index.html

# INTERACTIVE shell for debugging
# docker-compose run --rm --entrypoint /bin/bash driftwatch

# CLEAN UP outputs
# docker-compose down -v
# rm -rf docker-outputs/
